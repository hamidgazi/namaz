<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="50%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded App Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Radial Glow Behind Dome -->
  <circle cx="256" cy="250" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Crescent Moon at Top -->
  <path d="M 270 95 A 45 45 0 1 0 240 180 A 36 36 0 1 1 270 95 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
  <!-- Star next to Crescent -->
  <polygon points="275,120 279,132 291,132 281,139 285,151 275,144 265,151 269,139 259,132 271,132" fill="#fbbf24"/>

  <!-- Mosque Dome Silhouette -->
  <!-- Main Center Dome -->
  <path d="M 256 195 C 235 225 185 240 185 300 L 327 300 C 327 240 277 225 256 195 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Islamic Arch Gate inside Dome -->
  <path d="M 220 300 L 220 260 C 220 240 256 220 256 220 C 256 220 292 240 292 260 L 292 300 Z" fill="#070b14"/>

  <!-- Mosque Base / Pillars -->
  <rect x="150" y="300" width="212" height="60" rx="8" fill="url(#goldGrad)"/>
  
  <!-- Minaret Left -->
  <rect x="110" y="240" width="26" height="120" rx="4" fill="url(#goldGrad)"/>
  <path d="M 123 210 C 115 225 110 230 110 240 L 136 240 C 136 230 131 225 123 210 Z" fill="url(#accentGrad)"/>
  <circle cx="123" cy="205" r="4" fill="#fbbf24"/>

  <!-- Minaret Right -->
  <rect x="376" y="240" width="26" height="120" rx="4" fill="url(#goldGrad)"/>
  <path d="M 389 210 C 381 225 376 230 376 240 L 402 240 C 402 230 397 225 389 210 Z" fill="url(#accentGrad)"/>
  <circle cx="389" cy="205" r="4" fill="#fbbf24"/>

  <!-- Foundation Steps -->
  <rect x="120" y="365" width="272" height="14" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="100" y="385" width="312" height="12" rx="4" fill="#10b981" opacity="0.4"/>

  <!-- App Title Label at bottom -->
  <text x="256" y="445" font-family="-apple-system, system-ui, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#f9fafb" text-anchor="middle" letter-spacing="4">NAMAZ</text>
</svg>
